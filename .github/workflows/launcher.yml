name: Windows launcher
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: launcher-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test updater on Windows PowerShell 5.1
        shell: powershell
        run: ./tests/test_launcher.ps1
      - name: Build commit-pinned channel and launcher
        shell: powershell
        run: python tests/package_launcher.py dist --commit "$env:GITHUB_SHA"
      - name: Verify real engine download, import, and launcher UI
        shell: powershell
        run: |
          . ./launcher/Core.ps1
          $manifest = Read-Json ./dist/channel.json
          Assert-Manifest $manifest
          Install-Engine "$env:RUNNER_TEMP/brassline-engine" $manifest "$env:RUNNER_TEMP/empty"
          $engine = Get-EnginePath "$env:RUNNER_TEMP/brassline-engine" $manifest
          # Import the exact runtime payload, with no tests or source-only assets.
          $runtime = "$env:RUNNER_TEMP/brassline-runtime"
          New-Item -ItemType Directory -Path $runtime -Force | Out-Null
          foreach ($file in $manifest.files) {
            $dest = Join-Path $runtime $file.path
            New-Item -ItemType Directory -Path (Split-Path $dest) -Force | Out-Null
            Copy-Item -LiteralPath $file.path -Destination $dest
          }
          Invoke-GameImport $engine $runtime
          # Run the mixer suite using the exact release runtime plus the test script.
          New-Item -ItemType Directory -Path "$runtime/tests" -Force | Out-Null
          Copy-Item ./tests/test_audio.gd "$runtime/tests/test_audio.gd"
          $testLog = "$env:RUNNER_TEMP/brassline-audio-test.log"
          $process = Start-Process -FilePath $engine -ArgumentList @('--headless', '--path', ('"' + $runtime + '"'), '--log-file', ('"' + $testLog + '"'), '--', '--audio-test') -PassThru
          if (!$process.WaitForExit(60000)) { $process.Kill(); throw 'Audio test timed out.' }
          $testOutput = Get-Content -LiteralPath $testLog -Raw
          Write-Output $testOutput
          if ($process.ExitCode -ne 0 -or $testOutput -match '(SCRIPT ERROR|FAIL )' -or $testOutput -notmatch 'AUDIO_RESULT 59/59') { throw 'Audio test failed.' }
          Copy-Item ./tests/test_destroy.gd "$runtime/tests/test_destroy.gd"
          $destroyLog = "$env:RUNNER_TEMP/brassline-destroy-test.log"
          $process = Start-Process -FilePath $engine -ArgumentList @('--headless', '--path', ('"' + $runtime + '"'), '--log-file', ('"' + $destroyLog + '"'), '--', '--destroy-test', '--autonomous') -PassThru
          if (!$process.WaitForExit(180000)) { $process.Kill(); throw 'Destroy test timed out.' }
          $testOutput = Get-Content -LiteralPath $destroyLog -Raw
          Write-Output $testOutput
          if ($process.ExitCode -ne 0 -or $testOutput -match '(SCRIPT ERROR|FAIL )' -or $testOutput -notmatch 'DESTROY_RESULT_TEST (\d+)/\1\b') { throw 'Destroy test failed.' }
          Copy-Item ./tests/test_killcam.gd "$runtime/tests/test_killcam.gd"
          $killcamLog = "$env:RUNNER_TEMP/brassline-killcam-test.log"
          $process = Start-Process -FilePath $engine -ArgumentList @('--headless', '--path', ('"' + $runtime + '"'), '--log-file', ('"' + $killcamLog + '"'), '--', '--killcam-test') -PassThru
          if (!$process.WaitForExit(90000)) { $process.Kill(); throw 'Killcam test timed out.' }
          $testOutput = Get-Content -LiteralPath $killcamLog -Raw
          Write-Output $testOutput
          if ($process.ExitCode -ne 0 -or $testOutput -match '(SCRIPT ERROR|FAIL )' -or $testOutput -notmatch 'KILLCAM_RESULT (\d+)/\1\b') { throw 'Killcam test failed.' }
          Copy-Item ./tests/test_armory.gd "$runtime/tests/test_armory.gd"
          $armoryLog = "$env:RUNNER_TEMP/brassline-armory-test.log"
          $process = Start-Process -FilePath $engine -ArgumentList @('--headless', '--path', ('"' + $runtime + '"'), '--log-file', ('"' + $armoryLog + '"'), '--', '--armory-test') -PassThru
          if (!$process.WaitForExit(90000)) { $process.Kill(); throw 'Armory test timed out.' }
          $testOutput = Get-Content -LiteralPath $armoryLog -Raw
          Write-Output $testOutput
          if ($process.ExitCode -ne 0 -or $testOutput -match '(SCRIPT ERROR|FAIL )' -or $testOutput -notmatch 'ARMORY_RESULT (\d+)/\1\b') { throw 'Armory test failed.' }
          Copy-Item ./tests/test_presentation.gd "$runtime/tests/test_presentation.gd"
          $presentationLog = "$env:RUNNER_TEMP/brassline-presentation-test.log"
          $process = Start-Process -FilePath $engine -ArgumentList @('--headless', '--path', ('"' + $runtime + '"'), '--log-file', ('"' + $presentationLog + '"'), '--', '--presentation-test') -PassThru
          if (!$process.WaitForExit(90000)) { $process.Kill(); throw 'Presentation test timed out.' }
          $testOutput = Get-Content -LiteralPath $presentationLog -Raw
          Write-Output $testOutput
          if ($process.ExitCode -ne 0 -or $testOutput -match '(SCRIPT ERROR|FAIL )' -or $testOutput -notmatch 'PRESENTATION_RESULT (\d+)/\1\b') { throw 'Presentation test failed.' }
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/brassline-ui" -Force | Out-Null
          Copy-Item ./dist/channel.json "$env:RUNNER_TEMP/brassline-ui/test-channel.json"
          ./launcher/Launcher.ps1 -Root "$env:RUNNER_TEMP/brassline-ui" -SmokeTest
          Copy-Item "$env:RUNNER_TEMP/brassline-ui/launcher-preview.png" ./dist/launcher-preview.png
      - uses: actions/upload-artifact@v4
        with:
          name: Brassline-launcher-Windows
          path: dist/*
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Brassline-launcher-Windows
          path: dist
      - name: Publish launcher and channel
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view launcher >/dev/null 2>&1; then
            gh release create launcher --target "$GITHUB_SHA" --title "BRASSLINE Launcher" --notes "Download Brassline_Launcher_Windows.zip once, extract it, and run BRASSLINE_LAUNCHER.bat. Future game updates install from the launcher. Windows 10/11, 64-bit."
          fi
          gh release upload launcher dist/Brassline_Launcher_Windows.zip dist/SHA256SUMS.txt --clobber
          # Clients see the new commit only after verification and packaging succeed.
          gh release upload launcher dist/channel.json --clobber
